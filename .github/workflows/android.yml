name: Android offline build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test importer
        run: python3 -m unittest discover -s tests -v
      - name: Fetch poetry and Persian font
        run: |
          git clone --depth 1 https://github.com/ganjoor/ganjoor-data.git "$RUNNER_TEMP/ganjoor-data"
          python3 scripts/prepare.py --source "$RUNNER_TEMP/ganjoor-data"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf -o app/src/main/assets/Vazirmatn.ttf
          curl --fail --location --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt -o app/src/main/assets/OFL.txt
      - name: Build APK and run Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline corpus and image sharing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n ir.parseh.poetry/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/parseh-home.png
            adb pull /sdcard/parseh-home.png parseh-home.png
      - name: Bundle handoff
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/parseh-preview.apk
          cp app/src/main/assets/data-version.json dist/
          cp parseh-home.png dist/
          sha256sum dist/parseh-preview.apk > dist/SHA256SUMS
          du -h dist/parseh-preview.apk
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py > dist/RELEASE_NOTES.md
          gh release create "preview-${GITHUB_SHA:0:8}" dist/parseh-preview.apk dist/data-version.json dist/SHA256SUMS --target "$GITHUB_SHA" --title "پارسه — نسخهٔ آزمایشی ${GITHUB_SHA:0:8}" --prerelease --notes-file dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: parseh-android-preview
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests
          path: app/build/reports/androidTests/
